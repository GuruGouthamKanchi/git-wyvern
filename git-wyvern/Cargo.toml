[package]
name = "git-wyvern"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & Pair Programming"]
description = "Dynamic 16-bit Pixel-Art Dragon Evolution Engine for GitHub Profiles (GoT & HotD Wyverns)"

[dependencies]
image = { version = "0.24", default-features = false, features = ["png", "gif"] }
gif = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

